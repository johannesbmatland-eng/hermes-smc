market: "BTC/USD"
paper_trading:
  initial_capital: 100000
  currency: "USD"

timeframes:
  main: "5m"
  trend_1h: "1h"
  trend_15m: "15m"

trend_filter:
  enabled: true
  method: "ema_majority"   # EMA majority across 5m/15m/1h (structure is informational)
  ema_period: 50

fvq_detection:
  min_candles_since_fvg: 50
  fvg_buffer_pct: 0.001

entry:
  confirmation: "engulfing_or_ifvg"
  pullback_depth_pct: 0.5
  max_open_positions: 1
  max_trades_per_day: 1   # first valid SMC signal locks the NY calendar day
  cooldown_seconds: 300
  engulf_lookback: 2      # bearish FVG-touch → engulf on 1st or 2nd next candle

rsi:
  enabled: true
  period: 14
  long_max: 65            # no longs when RSI above this
  short_min: 35           # no shorts when RSI below this

# Contiguous KZP-style sessions (America/New_York).
# Each window ends exactly when the next starts — no Off-session gaps.
sessions:
  timezone: "America/New_York"
  filter_entries: true    # only open trades inside enabled windows
  windows:
    - { name: "ASIA", start: "20:00", end: "02:00", enabled: true }   # → LNDN
    - { name: "LNDN", start: "02:00", end: "09:30", enabled: true }   # → NYAM
    - { name: "NYAM", start: "09:30", end: "13:30", enabled: true }   # → NYPM
    - { name: "NYPM", start: "13:30", end: "20:00", enabled: true }   # → ASIA

exits:
  structure_break: false
  mode: "fixed_tp"       # fixed_tp | be_trail | trail_only — daily plan uses fixed 1:2
  be_at_rr: 1.5          # unused in fixed_tp (kept for be_trail experiments)
  trail_after_be: true
  trail_rr: 1.0
  tp_rr: 2.0             # unused in fixed_tp (risk.rr_target drives TP)
  be_buffer_pct: 0.0001

risk:
  # Daily plan: −1% on SL / +2% on TP → EV +0.5%/trade @ 50% WR ≈ ~10%/mnd (20 days)
  risk_pct_per_trade: 1.0
  rr_target: 2.0          # fixed 1:2 RR
  rr_alternative: 3.0
  # SL just beyond FVG zone edge (gap), NOT under candle-1's low
  sl_buffer_pct: 0.0003
