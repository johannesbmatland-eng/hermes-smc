market: "BTC/USD"
paper_trading:
  initial_capital: 100000
  currency: "USD"

timeframes:
  main: "5m"
  trend_1h: "1h"
  trend_15m: "15m"

trend_filter:
  enabled: true
  method: "ema_majority"   # EMA majority across 5m/15m/1h (structure is informational)
  ema_period: 50

fvq_detection:
  min_candles_since_fvg: 50
  fvg_buffer_pct: 0.001

entry:
  confirmation: "engulfing_or_ifvg"
  pullback_depth_pct: 0.5
  max_open_positions: 1
  cooldown_seconds: 300

exits:
  structure_break: false   # only SL/TP — keep FVG pullback trades alive

risk:
  risk_pct_per_trade: 0.5
  rr_target: 2.0          # 1:2 RR → risk 0.5% to make 1%
  rr_alternative: 3.0     # optional 1:3
  sl_buffer_pct: 0.002
