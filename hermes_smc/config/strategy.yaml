market: "BTC/USD"
paper_trading:
  initial_capital: 100000
  currency: "USD"

timeframes:
  main: "5m"
  trend_1h: "1h"
  trend_15m: "15m"

trend_filter:
  enabled: true
  method: "ema_majority"   # EMA majority across 5m/15m/1h
  ema_period: 50

fvq_detection:
  min_candles_since_fvg: 50
  fvg_buffer_pct: 0.001

entry:
  confirmation: "engulfing_or_ifvg"
  pullback_depth_pct: 0.5
  max_open_positions: 1
  cooldown_seconds: 120
  engulf_lookback: 2
  allowed_sides: ["short"]          # 6m: shorts dominate longs
  min_engulf_body_ratio: 1.5        # stronger engulf → higher WR/PF
  min_engulf_body_pct: 0.0

rsi:
  enabled: true
  period: 14
  long_max: 55
  short_min: 45

# Contiguous sessions (NY). Only ASIA + LNDN enabled for prop profile.
sessions:
  timezone: "America/New_York"
  filter_entries: true
  windows:
    - { name: "ASIA", start: "20:00", end: "02:00", enabled: true }
    - { name: "LNDN", start: "02:00", end: "09:30", enabled: true }
    - { name: "NYAM", start: "09:30", end: "13:30", enabled: false }
    - { name: "NYPM", start: "13:30", end: "20:00", enabled: false }

exits:
  structure_break: false
  mode: "fixed_tp"       # hard TP for higher winrate / prop stability
  be_at_rr: 0.55
  trail_after_be: false
  trail_rr: 1.0
  tp_rr: 1.2             # 1.2R take-profit
  be_buffer_pct: 0.0001

risk:
  risk_pct_per_trade: 1.35
  rr_target: 1.2
  rr_alternative: 1.5
  sl_buffer_pct: 0.0003
  max_daily_loss_pct: 2.0    # prop-style daily halt
  max_drawdown_pct: 6.0      # prop-style max DD halt
