market: "BTC/USD"
paper_trading:
  initial_capital: 100000
  currency: "USD"

timeframes:
  main: "5m"
  trend_1h: "1h"
  trend_15m: "15m"

trend_filter:
  enabled: true
  method: "ema_majority"   # EMA majority across 5m/15m/1h (structure is informational)
  ema_period: 50

fvq_detection:
  min_candles_since_fvg: 50
  fvg_buffer_pct: 0.001

entry:
  confirmation: "engulfing_or_ifvg"
  pullback_depth_pct: 0.5
  max_open_positions: 1
  cooldown_seconds: 300
  engulf_lookback: 2      # bearish FVG-touch → engulf on 1st or 2nd next candle

rsi:
  enabled: true
  period: 14
  long_max: 65            # no longs when RSI above this
  short_min: 35           # no shorts when RSI below this

exits:
  structure_break: false
  mode: "be_trail"       # fixed_tp | be_trail | trail_only
  be_at_rr: 2.0          # at 1:2 → move SL to break-even
  trail_after_be: true   # then trail favorable extreme
  trail_rr: 1.0          # trail distance = 1R behind peak/trough
  tp_rr: 5.0             # hard TP at 1:5 (0 = no hard TP, pure trail)
  be_buffer_pct: 0.0001  # tiny BE buffer past entry

risk:
  risk_pct_per_trade: 0.5
  rr_target: 2.0          # used for BE trigger alignment / legacy fixed TP
  rr_alternative: 3.0
  # SL just beyond FVG zone edge (gap), NOT under candle-1's low
  sl_buffer_pct: 0.0003
